<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GST Calculator</title>
  <meta name="description" content="Calculate GST amounts for invoices.">
  <style>
    body {font-family:Arial,Helvetica,sans-serif; max-width:600px; margin:40px auto; padding:20px;}
    input {margin-top:10px; padding:5px;}
    button {margin-top:15px; padding:8px 15px; background:#2563eb;color:white;border:none;border-radius:4px;cursor:pointer;}
    .result {margin-top:20px; font-weight:bold;}
  </style>
</head>
<body>
  <h1>GST Calculator</h1>
  <p>Enter the original amount and the GST rate (in percent).</p>
  <input type="number" id="amount" placeholder="Amount">
  <input type="number" id="rate" placeholder="GST Rate (%)">
  <button onclick="calculate()">Calculate</button>
  <div class="result" id="result"></div>

  <script>
    function calculate() {
      const amt = parseFloat(document.getElementById('amount').value);
      const rate = parseFloat(document.getElementById('rate').value);
      if (isNaN(amt) || isNaN(rate)) { document.getElementById('result').textContent='Please enter valid numbers.'; return; }
      const tax = amt * (rate / 100);
      const total = amt + tax;
      document.getElementById('result').textContent = `GST: ${tax} | Total: ${total}`;
  </script>
</body>
</html>
