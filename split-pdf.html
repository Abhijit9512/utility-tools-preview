<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Split PDF</title>
  <meta name="description" content="Split a PDF file into separate pages using client‑side JavaScript.">
  <style>
    body {font-family:Arial,Helvetica,sans-serif; max-width:800px; margin:40px auto; padding:20px;}
    .upload {border:2px dashed #9ca3af; padding:20px; text-align:center; margin-bottom:20px;}
    input {margin-top:10px; padding:5px;}
    button {background:#2563eb;color:white;padding:10px 20px;border:none;border-radius:4px;margin-top:10px;cursor:pointer;}
    .status {margin-top:10px;}
  </style>
</head>
<body>
  <h1>Split PDF</h1>
  <p>Select a PDF file and set start and end pages to split the document.</p>
  <div class="upload">
    <input type="file" id="fileInput" accept=".pdf">
    <label for="fileInput">Choose PDF</label>
  </div>
  <input type="number" id="startPage" placeholder="Start page" min="1" value="1">
  <input type="number" id="endPage" placeholder="End page" min="1" value="1">
  <button onclick="split()">Split</button>
  <div class="status" id="status"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.0/pdf.min.js"></script>
  <script>
    const fileInput = document.getElementById('fileInput');
    const startInput = document.getElementById('startPage');
    const endInput = document.getElementById('endPage');
    const statusDiv = document.getElementById('status');

    function split() {
      const files = fileInput.files;
      if (!files.length) {
        statusDiv.textContent = 'Select a PDF file';
        return;
      }
      const start = parseInt(startInput.value);
      const end = parseInt(endInput.value);
      if (isNaN(start) || isNaN(end)) {
        statusDiv.textContent = 'Invalid page numbers';
        return;
      }
      if (start < 1 || end < 1) {
        statusDiv.textContent = 'Page numbers must be at least 1';
        return;
      }
      if (start > end) {
        statusDiv.textContent = 'Start page cannot be greater than end page';
        return;
      }

      const reader = new FileReader();
      reader.onload = async e => {
        const pdfData = e.target.result;
        let pdfDoc;
        try {
          pdfDoc = await pdfLib.PDFDocument.load(pdfData);
        } catch (err) {
          statusDiv.textContent = 'Failed to load PDF';
          return;
        }
        const totalPages = pdfDoc.getPageCount();
        const realStart = Math.max(1, Math.min(start, totalPages));
        const realEnd = Math.min(totalPages, Math.max(end, 1));
        const newDoc = await pdfLib.PDFDocument.create();

        for (let i = realStart - 1; i < realEnd; i++) {
          const page = pdfDoc.copyPage(i);
          newDoc.addPage(page);
        }

        const newBytes = await newDoc.save();
        const blob = new Blob([newBytes], {type: 'application/pdf'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'split.pdf';
        a.click();
        URL.revokeObjectURL(url);
        statusDiv.textContent = 'Split complete';
      };
      reader.readAsArrayBuffer(files[0]);
    }
  </script>
</body>
</html>
