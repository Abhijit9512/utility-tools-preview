<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Formatter</title>
  <meta name="description" content="Format JSON data for readability.">
  <style>
    body {font-family:Courier New,monospace; max-width:800px; margin:40px auto; padding:20px; background:#f8f9fa;}
    textarea {width:100%; height:300px; font-family:inherit;}
    button {margin-top:10px; padding:8px 15px; background:#2563eb;color:white;border:none;border-radius:4px;}
    pre {background:#fff; border:1px solid #ddd; padding:10px; overflow:auto;}
  </style>
</head>
<body>
  <h1>JSON Formatter</h1>
  <textarea id="jsonInput" placeholder="{…}"></textarea>
  <button onclick="format()">Format</button>
  <pre id="formatted"></pre>

  <script>
    function format() {
      const raw = document.getElementById('jsonInput').value;
      let parsed;
      try { parsed = JSON.parse(raw); }
      catch (e) { document.getElementById('formatted').textContent='Invalid JSON.'; return; }
      document.getElementById('formatted').textContent = JSON.stringify(parsed, null, 2);
    }
  </script>
</html>
