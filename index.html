<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Online Tools Preview</title>
  <meta name="description" content="See your utility tools website preview here.">
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; line-height: 1.6; }
    h1 { color: #2563eb; text-align: center; }
    .btn { background: #2563eb; color: white; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin: 10px 5px; }
    .btn:hover { background: #1d4ed8; }
    .tools { display: grid; gap: 15px; margin-top: 30px; }
    .tool-card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 15px; text-align: center; }
    .tool-icon { font-size: 48px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h1>Free Online Tools Preview</h1>
  <p style="text-align: center; color: #6b7280;">This is a working preview of your utility tools platform</p>
  
  <div style="text-align: center; margin: 30px 0;">
    <button class="btn" onclick="alert('Merge PDF tool would open here!')">Try Merge PDF</button>
    <button class="btn" onclick="alert('Word Counter tool would open here!')">Try Word Counter</button>
    <button class="btn" onclick="alert('Image Compressor tool would open here!')">Try Image Compressor</button>
  </div>
  
  <div class="tools">
    <div class="tool-card">
      <div class="tool-icon">📄</div>
      <h3>PDF Tools</h3>
      <p>Merge, split, convert PDFs</p>
    </div>
    <div class="tool-card">
      <div class="tool-icon">🖼️</div>
      <h3>Image Tools</h3>
      <p>Compress, resize, convert images</p>
    </div>
    <div class="tool-card">
      <div class="tool-icon">📝</div>
      <h3>Text Tools</h3>
      <p>Word count, case conversion, etc.</p>
    </div>
  </div>
  
  <p style="text-align: center; margin-top: 40px; color: #9ca3af; font-size: 14px;">
    Preview version • Actual tools coming soon • Built for Cloudflare Pages
  </p>
</body>
</html>
