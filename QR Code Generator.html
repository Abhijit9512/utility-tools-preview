<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>
  <meta name="description" content="Create a QR code from any text.">
  <style>
    body {font-family:Arial,Helvetica,sans-serif; max-width:600px; margin:40px auto; padding:20px;}
    textarea {width:100%; height:100px; margin-bottom:10px;}
    button {padding:10px 20px; background:#2563eb;color:white;border:none;border-radius:4px;cursor:pointer;}
    #qr {margin-top:15px;}
  </style>
</head>
<body>
  <h1>QR Code Generator</h1>
  <textarea id="text" placeholder="Enter text here…"></textarea>
  <button onclick="generate()">Generate QR</button>
  <div id="qr"></div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script>
    function generate() {
      const txt = document.getElementById('text').value;
      if (!txt) { alert('Enter text first'); return; }
      const canvas = document.createElement('canvas');
      QRCode.toCanvas(txt, {width:300, margin:0}, (error) => {
        if (error) { alert('Error generating QR'); return; }
        const img = document.createElement('img');
        img.src = canvas.toDataURL('image/png');
        const container = document.getElementById('qr');
        container.innerHTML = '';
        container.appendChild(img);
      });
    }
  </script>
</body>
</html>
